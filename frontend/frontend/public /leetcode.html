<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body{
            background-color: #6c6868;
            font-family: Arial;

        }
        header{
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: 18px;
        }
        header span{
            margin-right: 5px;
        }
        .bi-bug, bi-play-fill, .bi-cloud-arrow-up, .bi-file-earmark, .bi-stars, .bi-columns-gap, .bi-gear, .timer{
            background-color: #e8e7e7;
            border-radius: 5px;
            padding: 5px;
        }
        .btn-premium{
            background-color: #f5c518;
            border-radius: 5px;
            padding: 5px;
            color: gold;
        }
        

    </style>
</head>
<body>
    <header>
        <div>
            <span class="bi bi-javascript"> </span>
            <span>30 Days of Javascript</span>
            <span class="bi bi-chevron-left"></span>
            <span class="bi bi-chevron-right"></span>
            <span class="bi bi-shuffle"></span>
        </div>
        <div>
            <span class="bi bi-bug"></span>
            <span class="bi bi-play-fill"></span>
            <span class="bi bi-cloud-arrow-up"> Submit</span>
            <span class="bi bi-file-earmark"></span>
            <span class="bi bi-stars"></span>
            <span class="bi bi-columns-gap"></span>
            <span class="bi bi-gear"></span>
            <span class="timer">
                <span class="bi bi-chevron-left"></span>
                <span class="bi bi-pause-fill"></span>
                <span>688:45:09</span>
                <span class="bi bi-arrow-repeat"></span>
                <span class="bi bi-three-dots-vertical"></span>
            </span>
              <span>Register or Login</span>
            <span class="btn-premium">Premium</span>

        </div>
    </header>
</body>
</html>
